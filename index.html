<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text To Speech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Text To Speech</h1>
    <textarea id="text" placeholder="Write your text here..."></textarea>
    <div id="row">
        <select id=""></select>
        <button id="play" onclick="speak()"><img src="play_button.png" alt="" >Listen</button>
        <button id="pause" style="display: none;" onclick="stop()"><img src="pause_button.png" alt="" >Stop</button>
    </div>

    <script src="index.js"></script>
</body>
</html>3
